<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Find Your Route | Quarterline &amp; Rock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&family=Roboto:wght@500&display=swap">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #1B2A4A;
    --periwinkle: #7B8FBF;
    --blue-mid: #4A6FA5;
    --coral: #E8604C;
    --coral-dark: #D4503D;
    --light-bg: #F4F5F7;
    --cream: #EFE7DD;
    --text-dark: #1B2A4A;
    --text-body: #3A3F4B;
    --line: #D9DCE3;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', Arial, sans-serif;
    color: var(--text-body);
    background: #fff;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header, matching the site nav */
  header {
    background: var(--navy);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .header-inner {
    max-width: 640px; margin: 0 auto; height: 64px;
    padding: 0 20px; display: flex; align-items: center;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Roboto', Arial, sans-serif; font-weight: 500; font-size: 15px;
    letter-spacing: 0.08em; text-transform: uppercase; color: #fff;
  }

  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 40px 20px calc(120px + env(safe-area-inset-bottom, 0px)); }

  .label {
    font-family: 'Roboto', Arial, sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--coral);
    margin-bottom: 14px;
  }
  h1, .q {
    font-family: 'Source Serif 4', Georgia, serif; font-weight: 400;
    color: var(--text-dark); line-height: 1.2;
  }
  h1 { font-size: clamp(30px, 6vw, 40px); margin-bottom: 16px; }
  .q { font-size: clamp(26px, 5.5vw, 34px); margin-bottom: 10px; }
  .lede, .hint { font-size: 17px; line-height: 1.7; }
  .hint { color: #6B7180; font-size: 15px; margin-bottom: 24px; min-height: 1px; }
  .lede { margin-bottom: 28px; }

  .progress { height: 3px; background: var(--light-bg); margin-bottom: 32px; }
  .progress div { height: 100%; width: 0; background: var(--coral); transition: width .3s ease; }

  /* Answer choices */
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px;
    padding: 14px 18px; text-align: left; cursor: pointer;
    font: inherit; font-size: 17px; line-height: 1.45; color: var(--text-dark);
    background: #fff; border: 1px solid var(--line); border-radius: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .opt:hover { border-color: var(--periwinkle); }
  .opt.sel { border-color: var(--coral); box-shadow: inset 0 0 0 1px var(--coral); }
  .mark {
    flex: none; width: 20px; height: 20px; border: 1px solid var(--periwinkle);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .many .mark { border-radius: 2px; }
  .opt.sel .mark { border-color: var(--coral); background: var(--coral); }
  .opt.sel .mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .many .opt.sel .mark::after { width: 5px; height: 10px; border-radius: 0; background: none; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }

  /* Bottom action bar, pinned within thumb reach on phones */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.96);
    border-top: 1px solid var(--line);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .bar-inner { max-width: 600px; margin: 0 auto; display: flex; gap: 12px; }
  .btn {
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    padding: 14px 24px; border-radius: 2px; cursor: pointer; border: none;
  }
  .btn-primary { flex: 1; background: var(--coral); color: #fff; }
  .btn-primary:hover { background: var(--coral-dark); }
  .btn-primary:disabled { background: #F2B3A9; cursor: default; }
  .btn-back { background: transparent; color: var(--text-dark); border: 1px solid var(--line); }
  .btn-back[hidden], .btn-primary[hidden] { display: none; }

  /* Results */
  .note { background: var(--light-bg); padding: 16px 18px; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
  .route { border-top: 3px solid var(--coral); padding: 18px 0 28px; }
  .route-num { margin-bottom: 8px; }
  .route h3 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 22px; color: var(--text-dark); line-height: 1.25; margin-bottom: 8px; }
  .route p { font-size: 16px; line-height: 1.7; }
  .status { font-size: 13px; font-weight: 500; color: var(--blue-mid); margin-top: 8px; }
  .route .aside { margin-top: 10px; font-size: 15px; color: #6B7180; }

  /* Contact form */
  .contact { background: var(--cream); padding: 28px 22px; margin-top: 12px; }
  .contact h2 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 26px; color: var(--text-dark); line-height: 1.2; margin-bottom: 8px; }
  .contact p { font-size: 16px; margin-bottom: 18px; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 14px; font-weight: 500; color: var(--text-dark); margin-bottom: 6px; }
  .field input {
    width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; color: var(--text-dark);
    background: #fff; border: 1px solid var(--line); border-radius: 2px;
  }
  .field input:focus, .opt:focus-visible, .btn:focus-visible { outline: 2px solid var(--blue-mid); outline-offset: 2px; }
  .contact .btn-primary { width: 100%; margin-top: 6px; }
  .contact .small { font-size: 13px; color: #6B7180; margin: 12px 0 0; }
  .thanks { font-size: 16px; color: var(--text-dark); }
  .error { color: #B4372A; font-size: 14px; margin-top: 8px; }
  .fine { font-size: 13px; color: #6B7180; margin-top: 28px; }
  .restart { margin-top: 20px; display: flex; gap: 24px; }
  .linkbtn { font: inherit; font-size: 15px; font-weight: 500; color: var(--blue-mid); background: none; border: none; padding: 8px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .bar[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">
      <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/><circle cx="20" cy="5" r="5" fill="#E8604C"/><circle cx="35" cy="20" r="5" fill="#ECE5D5"/><circle cx="20" cy="35" r="5" fill="#7B8FBF"/><circle cx="5" cy="20" r="5" fill="#4A6FA5"/></svg>
      Quarterline &amp; Rock
    </div>
  </div>
</header>
<main id="stage" aria-live="polite"></main>
<div class="bar" id="bar">
  <div class="bar-inner">
    <button class="btn btn-back" id="back" hidden>Back</button>
    <button class="btn btn-primary" id="next">Start</button>
  </div>
</div>

<script>
/* ---- Settings ---- */
const ACCESS_CODE = "LOCAL";          // shared in person; not case-sensitive
const SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbwik2Dd-YM90jv33PTl2jI9G5RbxtIgJjfCXD4EtuxvzcUu6nss0uDbRDKt0V7K_Ib3ZQ/exec";

const Q = [
  {id:"goal", q:"What’s your goal for this money?", type:"one", opts:[
    ["grow","Grow wealth I can use or pass on to my family"],
    ["gift","Leave a lasting gift to my community"],
    ["org","Invest a foundation’s or nonprofit’s funds that I help oversee"]]},
  {id:"charity", q:"Do you have a specific local nonprofit in mind?", type:"one",
    show:a=>a.goal==="gift",
    opts:[["yes","Yes, there’s an organization I already support"],["no","No, not a specific one"]]},
  {id:"size", q:"How much are you thinking about?", type:"one",
    show:a=>a.goal==="grow" || (a.goal==="gift" && a.charity==="no"),
    opts:[["small","Under $250,000"],["large","$250,000 or more"]]},
  {id:"accredited", q:"Are you an accredited investor?", hint:"Generally, $200,000 or more in annual income, or $1 million or more in net worth not counting your home.", type:"one",
    show:a=>a.goal==="grow",
    opts:[["yes","Yes"],["no","No"],["unsure","I’m not sure"]]},
  {id:"have", q:"Which of these do you have?", hint:"Choose any that apply.", type:"many", show:a=>a.goal!=="org", opts:a=>[
    ["ira","A retirement account, such as an IRA"],
    ...(a.goal==="grow" ? [["biz","A business"]] : []),
    ...(giving(a) ? [["daf","A donor-advised fund"]] : []),
    ["none","None"]]},
  {id:"age", q:"Are you 70½ or older?", type:"one",
    show:a=>giving(a) && a.have.includes("ira"),
    opts:[["yes","Yes"],["no","No"]]}
];
function giving(a){ return a.goal==="gift" || (a.goal==="grow" && a.accredited==="no"); }

const R = {
  personal:{t:"Invest from your own savings", d:"Invest directly in The Local Fund as a limited partner from your savings or brokerage account.", s:"Open now"},
  ira:{t:"Invest through a self-directed IRA", d:"Invest retirement savings through a self-directed IRA custodian. The fund has a vehicle built for tax-exempt investors like IRAs.", s:"Open now"},
  company:{t:"Invest through your business", d:"Your business invests directly as a limited partner. The business needs to qualify as an accredited investor on its own.", s:"Open now"},
  org:{t:"Invest from your organization’s funds", d:"Your foundation or nonprofit invests directly as a limited partner from its own assets.", s:"Open now"},
  cfec:{t:"A donor-advised fund at the Elkhart County Community Foundation", d:"For gifts of $250,000 or more. Give to a donor-advised fund with a local sponsor and recommend it invest in The Local Fund. You keep advising on the investment and on future grants.", s:"Open now"},
  catacap:{t:"The CataCap donor-advised fund for The Local Fund", d:"For gifts under $250,000. Your gift joins a pooled donor-advised fund that invests in The Local Fund. Gifts can start at $250 once the fund reaches $50,000 in pledges. You keep advising, and returns stay in your account for future giving.", s:"Collecting first pledges"},
  nonprofit:{t:"Give to the nonprofit you support", d:"Make your gift to the organization you care about. Its board decides how to invest its reserves or endowment, and some local organizations invest part of theirs in The Local Fund. We’re glad to help start that conversation.", s:"Open now"},
  qcd:{t:"Give from your IRA to a community foundation fund", d:"A qualified charitable distribution lets you give directly from your IRA, up to $111,000 per person in 2026, to a community foundation fund for local economic development. It can count toward your required minimum distribution, and the foundation decides how it’s invested.", s:"Coming soon"}
};

const params = new URLSearchParams(location.search);
const SOURCE = (params.get("from") || "").slice(0, 40);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
let RID = newId();

let step = -1;        // -1 = access/intro, 0..n = questions, n = results
let a = {have: []};
let routes = [];

const stage = document.getElementById("stage");
const nextBtn = document.getElementById("next");
const backBtn = document.getElementById("back");
const bar = document.getElementById("bar");

const visible = () => Q.filter(q => !q.show || q.show(a));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function unlocked(){ try { return sessionStorage.getItem("rf-ok") === "1"; } catch(e){ return false; } }
function setUnlocked(){ try { sessionStorage.setItem("rf-ok","1"); } catch(e){} }

function send(payload){
  if (!SCRIPT_URL || SCRIPT_URL.startsWith("PASTE")) return Promise.resolve();
  return fetch(SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
}

function render(){
  window.scrollTo(0, 0);
  if (step === -1) return intro();
  const qs = visible();
  if (step >= qs.length) return results();
  const q = qs[step];
  const opts = typeof q.opts === "function" ? q.opts(a) : q.opts;
  let h = `<div class="progress"><div style="width:${(step/qs.length)*100}%"></div></div>
    <p class="label">Question ${step+1}</p>
    <h1 class="q">${q.q}</h1><p class="hint">${q.hint || ""}</p>
    <div class="opts ${q.type==="many"?"many":""}" role="${q.type==="many"?"group":"radiogroup"}">`;
  opts.forEach(([v,l]) => {
    const sel = q.type==="many" ? a.have.includes(v) : a[q.id]===v;
    h += `<button class="opt${sel?" sel":""}" data-v="${v}" role="${q.type==="many"?"checkbox":"radio"}" aria-checked="${sel}"><span class="mark"></span>${l}</button>`;
  });
  h += `</div>`;
  if (q.type === "one") h += `<p class="restart"><button class="linkbtn" id="qback">Back</button></p>`;
  stage.innerHTML = h;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (q.type === "many"){
      if (v === "none") a.have = a.have.includes("none") ? [] : ["none"];
      else a.have = a.have.includes(v) ? a.have.filter(x => x!==v) : [...a.have.filter(x => x!=="none"), v];
    }
    else {
      a[q.id] = v;
      if (q.id === "goal"){ delete a.accredited; delete a.charity; delete a.age; delete a.size; a.have = []; }
      if (q.id === "accredited"){ a.have = a.have.filter(x => x!=="daf"); delete a.age; }
      stage.querySelectorAll(".opt").forEach(o => { const on = o === b; o.classList.toggle("sel", on); o.setAttribute("aria-checked", on); });
      clearTimeout(window._adv);
      window._adv = setTimeout(() => { step++; render(); }, 250);
      return;
    }
    render();
  });
  bar.hidden = q.type === "one";
  backBtn.hidden = false;
  nextBtn.hidden = false;
  nextBtn.textContent = step === qs.length-1 ? "See my routes" : "Next";
  nextBtn.disabled = false;
  nextBtn.onclick = () => { step++; render(); };
  backBtn.onclick = () => { step--; render(); };
  const qb = document.getElementById("qback");
  if (qb) qb.onclick = () => { clearTimeout(window._adv); step--; render(); };
}

function intro(){
  const ok = unlocked();
  stage.innerHTML = `<p class="label">The Local Fund</p>
    <h1>Find your route to investing in local ownership</h1>
    <p class="lede">A few questions about you and your money. At the end you’ll see every way you can take part, and you can ask us for details if you’d like.</p>
    ${ok ? "" : `<label class="field"><span>Access code</span><input id="code" autocomplete="off" autocapitalize="characters" inputmode="text"></label><p class="error" id="err" hidden>That code doesn’t match. Check with the person who shared this page.</p>`}`;
  bar.hidden = false;
  backBtn.hidden = true;
  nextBtn.hidden = false;
  nextBtn.disabled = false;
  nextBtn.textContent = "Start";
  const go = () => {
    if (!ok){
      const v = (document.getElementById("code").value || "").trim().toUpperCase();
      if (v !== ACCESS_CODE.toUpperCase()){ document.getElementById("err").hidden = false; return; }
      setUnlocked();
    }
    step = 0; render();
  };
  nextBtn.onclick = go;
  const input = document.getElementById("code");
  if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

function card(k, extra){ routes.push(R[k].t); return `<div class="route"><p class="label route-num">Route ${routes.length}</p><h3>${R[k].t}</h3><p>${R[k].d}</p>${extra ? `<p class="aside">${extra}</p>` : ""}<p class="status">${R[k].s}</p></div>`; }
const note = t => `<div class="note">${t}</div>`;

function gifts(has){
  let h = "";
  const qcdOk = a.age === "yes" && has("ira");
  if (a.charity === "yes"){
    const extras = [];
    if (qcdOk) extras.push("Because you’re 70½ or older, you can give from your IRA through a qualified charitable distribution, up to $111,000 per person in 2026.");
    if (has("daf")) extras.push("You can also grant to them from your existing donor-advised fund.");
    return card("nonprofit", extras.join(" "));
  }
  if (qcdOk) h += card("qcd");
  h += card(a.size === "large" ? "cfec" : "catacap", has("daf") ? "You can grant from your existing donor-advised fund into this route." : "");
  return h;
}

function results(){
  routes = [];
  const has = x => a.have.includes(x);
  const minNote = note("The standard minimum is $250,000. Talk with us about the minimum investment.");
  let h = `<p class="label">Your routes</p><h1 class="q">Here’s how you can take part</h1><p class="hint">Based on your answers, these fit.</p>`;
  if (a.goal === "org") h += card("org");
  else if (a.goal === "grow"){
    if (a.accredited === "no"){
      if (has("biz")){ if (a.size === "small") h += minNote; h += card("company"); }
      h += note("Investing directly as an individual requires being an accredited investor. If you’re open to giving instead, these routes let you support The Local Fund now.");
      h += gifts(has);
    } else {
      if (a.accredited === "unsure") h += note("Investing directly requires being an accredited investor. Check with your advisor, and talk with us about which route fits.");
      if (a.size === "small") h += minNote;
      h += card("personal"); if (has("ira")) h += card("ira"); if (has("biz")) h += card("company");
    }
  } else h += gifts(has);

  h += `<section class="contact" id="contact">
      <h2>Want details on your routes?</h2>
      <p>Leave your name and email and we’ll follow up with specifics. This is optional. Your answers are saved without your name unless you add it here.</p>
      <label class="field"><span>Name</span><input id="cname" autocomplete="name"></label>
      <label class="field"><span>Email</span><input id="cemail" type="email" autocomplete="email" inputmode="email"></label>
      <button class="btn btn-primary" id="csend">Send me details</button>
      <p class="error" id="cerr" hidden>Add an email address so we can reach you.</p>
      <p class="small">We’ll only use this to follow up about your routes.</p>
    </section>
    <p class="fine">This is a starting point, not tax, legal or investment advice. Talk with your advisor and with us before you decide.</p>
    <p class="restart"><button class="linkbtn" id="back2">Change my answers</button> <button class="linkbtn" id="restart">Start over</button></p>`;
  stage.innerHTML = h;

  send({type:"answers", id:RID, from:SOURCE, goal:a.goal, charity:a.charity||"", size:a.size||"", accredited:a.accredited||"", have:a.have, age:a.age||"", routes});

  document.getElementById("csend").onclick = () => {
    const name = document.getElementById("cname").value.trim();
    const email = document.getElementById("cemail").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)){ document.getElementById("cerr").hidden = false; return; }
    send({type:"contact", id:RID, name, email}).finally(() => {
      document.getElementById("contact").innerHTML = `<h2>Thanks, we’ll be in touch.</h2><p class="thanks">We’ll follow up at ${esc(email)} with details on your routes.</p>`;
    });
  };

  bar.hidden = true;
  document.getElementById("back2").onclick = () => { step--; render(); };
  document.getElementById("restart").onclick = () => { a = {have: []}; step = 0; RID = newId(); render(); };
}

render();
</script>
</body>
</html>
